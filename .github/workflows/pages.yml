name: Deploy SINKA QUANT
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check login module syntax
        run: |
          node --check auth-web.mjs
          for file in strategy/*.mjs worker/*.mjs; do node --check "$file"; done
      - name: Verify read-only session and safe diagnostics
        run: node --test tests/*.test.mjs
      - name: Verify bounded VM deployment checks
        run: |
          python3 -m unittest discover -s tests -p test_vm_verify.py
          bash -n firebase/deploy-paper-vm.sh worker/vm-startup.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
