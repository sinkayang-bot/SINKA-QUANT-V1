name: Backend tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'firebase/deploy-okx-smoke-job.sh'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'firebase/deploy-okx-smoke-job.sh'
      - '.github/workflows/backend-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py firebase_auth.py firestore_ledger.py firestore_app.py firestore_monitor.py monitor_lease.py okx_readonly.py okx_risk.py okx_orders.py okx_instruments.py okx_order_reader.py okx_reconcile.py okx_admission.py okx_sync.py okx_sync_gate.py okx_sync_store.py okx_firestore_sync.py okx_sync_lease.py okx_readonly_worker.py okx_pending_orders.py okx_order_journal.py okx_position_journal.py okx_fills.py okx_fill_position.py okx_fill_checkpoint.py okx_fill_watermark_store.py okx_fill_audit.py okx_smoke.py
      - run: python -m py_compile leased_monitor.py
      - name: Run backend unit tests
        run: python -m pytest -q tests --junitxml=pytest-unit.xml
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-results
          path: backend/pytest-unit.xml
          if-no-files-found: warn

  okx-worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated OKX read-only worker
        run: docker build -f backend/Dockerfile.okx-readonly -t sinka-okx-readonly:ci backend
      - name: Verify worker cannot start without explicit opt-in
        run: |
          if docker run --rm sinka-okx-readonly:ci > /tmp/okx-start.out 2>&1; then
            echo "Unsafe: worker started without opt-in"; exit 1
          fi
          grep -q "disabled by default" /tmp/okx-start.out

  okx-smoke-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated demo-only smoke image
        run: docker build -f backend/Dockerfile.okx-smoke -t sinka-okx-demo-smoke:ci backend
      - name: Require explicit demo smoke opt-in
        run: |
          if docker run --rm sinka-okx-demo-smoke:ci > /tmp/okx-smoke.out 2>&1; then
            echo "Unsafe: smoke image started without opt-in" >&2
            exit 1
          fi
          grep -q "Demo mode must be explicitly enabled" /tmp/okx-smoke.out

  firestore-emulator:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_PROJECT: sinka-emulator
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pip install -r backend/requirements.txt pytest
      - run: npm install --no-save firebase-tools
      - run: npx firebase emulators:exec --project sinka-emulator --only firestore "cd backend && python -m pytest -q tests/test_lease_emulator.py tests/test_okx_firestore_emulator.py tests/test_okx_journal_emulator.py tests/test_okx_position_emulator.py tests/test_okx_fill_watermark_emulator.py tests/test_okx_demo_control_emulator.py --junitxml=pytest-firestore.xml"
        timeout-minutes: 10
      - name: Upload Firestore emulator report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-emulator-test-results
          path: backend/pytest-firestore.xml
          if-no-files-found: warn

  okx-status-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated Firebase-protected status API
        run: docker build -f backend/Dockerfile.okx-status -t sinka-okx-status:ci backend
      - name: Import API without credentials or network
        run: >-
          docker run --rm --network none --entrypoint python sinka-okx-status:ci
          -c "import okx_status_app; assert okx_status_app.app.openapi_url is None; print('Isolated status API imported without credentials')"

  demo-control-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build owner-only demo command API without exchange modules
        run: docker build -f backend/Dockerfile.okx-demo-control -t sinka-demo-control:ci backend
      - name: Import without credentials or networking
        run: >-
          docker run --rm --network none --entrypoint python sinka-demo-control:ci
          -c "import okx_demo_control_app; from pathlib import Path; assert not Path('okx_demo_cloudshell.py').exists(); assert okx_demo_control_app.app.openapi_url is None"
