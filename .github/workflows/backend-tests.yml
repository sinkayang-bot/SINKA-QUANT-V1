name: Backend tests
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py firebase_auth.py firestore_ledger.py firestore_app.py firestore_monitor.py monitor_lease.py okx_readonly.py okx_risk.py okx_orders.py okx_instruments.py okx_order_reader.py okx_reconcile.py okx_admission.py okx_sync.py okx_sync_gate.py okx_sync_store.py okx_firestore_sync.py okx_sync_lease.py okx_readonly_worker.py okx_pending_orders.py
      - run: python -m py_compile leased_monitor.py
      - run: pytest -q tests

  firestore-emulator:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_PROJECT: sinka-emulator
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pip install -r backend/requirements.txt pytest
      - run: npm install --no-save firebase-tools
      - run: npx firebase emulators:exec --project sinka-emulator --only firestore "cd backend && python -m pytest -q tests/test_lease_emulator.py"
        timeout-minutes: 10
